name: Android Debug Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload android26 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android26-debug
          path: app/build/outputs/apk/android26/debug/*.apk

      - name: Upload android33 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android33-debug
          path: app/build/outputs/apk/android33/debug/*.apk