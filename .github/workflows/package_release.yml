name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (contoh: v8.0.7-daygreen, tanpa suffix flavor)'
        required: true
      message:
        description: 'What is new (pakai \n untuk baris baru)'
        required: true

permissions:
  contents: write

concurrency:
  group: telegram-userbot
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          FILE="app/build.gradle"
          [ -f "app/build.gradle.kts" ] && FILE="app/build.gradle.kts"

          # versionName pertama = defaultConfig
          VERSION_NAME=$(grep -m1 'versionName' "$FILE" | sed -E 's/.*versionName[[:space:]=]*"([^"]+)".*/\1/')
          PACKAGE=$(grep -m1 'applicationId' "$FILE" | sed -E 's/.*applicationId[[:space:]=]*"([^"]+)".*/\1/')

          if [ -z "$VERSION_NAME" ]; then
            echo "Error: versionName tidak ditemukan!"
            exit 1
          fi

          if [ "$VERSION_NAME" != "$INPUT_VERSION" ]; then
            echo "Error: versionName di gradle ($VERSION_NAME) beda dengan input ($INPUT_VERSION)"
            exit 1
          fi

          # Pastikan kedua flavor juga punya versionName yang sesuai
          for FLAVOR in android26 android33; do
            if ! grep -q "versionName \"${INPUT_VERSION}-${FLAVOR}\"" "$FILE"; then
              echo "Error: versionName flavor $FLAVOR tidak sesuai (harus ${INPUT_VERSION}-${FLAVOR})"
              exit 1
            fi
          done

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG sudah ada. Workflow dihentikan agar tidak duplicate."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: steps.check_tag.outputs.exists == 'false'
        env:
          INPUT_MESSAGE: ${{ inputs.message }}
        run: printf '%b\n' "$INPUT_MESSAGE" > notes.md

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Set up JDK 17
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache dependency Gradle dan build cache
      - name: Setup Gradle
        if: steps.check_tag.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        if: steps.check_tag.outputs.exists == 'false'
        run: chmod +x gradlew

      - name: Build release APKs
        if: steps.check_tag.outputs.exists == 'false'
        run: ./gradlew assembleRelease --build-cache --stacktrace

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            app/build/outputs/apk/android26/release/*.apk
            app/build/outputs/apk/android33/release/*.apk

      - name: Set up Python
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pyrogram & Dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: pip install pyrofork tgcrypto

      - name: Send APKs to Telegram (Userbot)
        if: steps.check_tag.outputs.exists == 'false'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.version }}
          APP_NAME: Sketchware DayGreen
          APP_PACKAGE: ${{ steps.version.outputs.package }}
          REPO: ${{ github.repository }}
          NOTES_FILE: notes.md
        run: python send_telegram.py