name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-userbot
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release info from message_commit.txt
        id: version
        run: |
          MSG_FILE="message_commit.txt"
          if [ ! -f "$MSG_FILE" ]; then
            echo "Error: $MSG_FILE tidak ditemukan di root repo"
            exit 1
          fi

          trim() { sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//'; }

          VERSION=$(tr -d '\r' < "$MSG_FILE" | grep -m1 -E '^VERSION:' | sed -E 's/^VERSION:[[:space:]]*//' | trim)
          CODE=$(tr -d '\r' < "$MSG_FILE" | grep -m1 -E '^CODE_VERSION:' | sed -E 's/^CODE_VERSION:[[:space:]]*//' | trim)
          TITLE=$(tr -d '\r' < "$MSG_FILE" | grep -m1 -E '^COMMIT_MESSAGE:' | sed -E 's/^COMMIT_MESSAGE:[[:space:]]*//' | trim)

          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "Error: VERSION dan CODE_VERSION wajib ada di $MSG_FILE"
            exit 1
          fi
          if ! echo "$CODE" | grep -qE '^[0-9]+$'; then
            echo "Error: CODE_VERSION harus angka, dapat: $CODE"
            exit 1
          fi

          FILE="app/build.gradle"
          if [ -f "app/build.gradle.kts" ]; then FILE="app/build.gradle.kts"; fi

          GRADLE_NAME=$(grep -m1 'versionName' "$FILE" | sed -E 's/.*versionName[[:space:]=]*"([^"]+)".*/\1/')
          GRADLE_CODE=$(grep -m1 'versionCode' "$FILE" | sed -E 's/.*versionCode[[:space:]=]*([0-9]+).*/\1/')
          PACKAGE=$(grep -m1 'applicationId' "$FILE" | sed -E 's/.*applicationId[[:space:]=]*"([^"]+)".*/\1/')

          if [ "$GRADLE_NAME" != "$VERSION" ]; then
            echo "Error: versionName di $FILE ($GRADLE_NAME) beda dengan VERSION di $MSG_FILE ($VERSION)"
            exit 1
          fi
          if [ "$GRADLE_CODE" != "$CODE" ]; then
            echo "Error: versionCode di $FILE ($GRADLE_CODE) beda dengan CODE_VERSION di $MSG_FILE ($CODE)"
            exit 1
          fi
          for FLAVOR in android26 android33; do
            if ! grep -q "versionName \"${VERSION}-${FLAVOR}\"" "$FILE"; then
              echo "Error: versionName flavor $FLAVOR tidak sesuai (harus ${VERSION}-${FLAVOR})"
              exit 1
            fi
          done

          # Catatan rilis: COMMIT_MESSAGE jadi poin pertama, baris lain jadi poin berikutnya
          {
            if [ -n "$TITLE" ]; then echo "- $TITLE"; fi
            tr -d '\r' < "$MSG_FILE" \
              | grep -v -E '^(VERSION|CODE_VERSION|COMMIT_MESSAGE):' \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | awk 'NF { if ($0 ~ /^- /) print; else print "- " $0 }'
          } > notes.md

          # Kalau catatan kosong, pakai daftar commit sejak tag terakhir
          if [ "$(tr -d '[:space:]' < notes.md | wc -c)" -eq 0 ]; then
            PREV=$(git tag --sort=-v:refname | head -n1)
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
            git log --no-merges --pretty=format:'- %s' "$RANGE" > notes.md
            echo "" >> notes.md
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "--- isi notes.md ---"
          cat notes.md

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG sudah ada. Workflow dihentikan agar tidak duplicate."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Set up JDK 17
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.check_tag.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        if: steps.check_tag.outputs.exists == 'false'
        run: chmod +x gradlew

      - name: Build release APKs
        if: steps.check_tag.outputs.exists == 'false'
        run: ./gradlew assembleRelease --build-cache --stacktrace

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            app/build/outputs/apk/android26/release/*.apk
            app/build/outputs/apk/android33/release/*.apk

      - name: Set up Python
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pyrogram & Dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: pip install pyrofork tgcrypto

      - name: Send APKs to Telegram (Userbot)
        if: steps.check_tag.outputs.exists == 'false'
        timeout-minutes: 15
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.version }}
          APP_NAME: Sketchware DayGreen
          APP_PACKAGE: ${{ steps.version.outputs.package }}
          REPO: ${{ github.repository }}
          NOTES_FILE: notes.md
        run: python send_telegram.py