name: Android Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload android26 release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-android26-release
          path: app/build/outputs/apk/android26/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload android33 release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-android33-release
          path: app/build/outputs/apk/android33/release/*.apk
          if-no-files-found: error
          retention-days: 30
