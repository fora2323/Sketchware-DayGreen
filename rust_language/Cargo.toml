[package]
name = "rust_language"
version = "0.1.0"
edition = "2024"
resolver = "2"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false
debug = 1

[dependencies]
jni = "0.21.1"
roxmltree = "0.21.1"
rustc-hash = "2.1.1"
serde_json = "1.0.145"
tree-sitter = "0.22"
tree-sitter-java = "0.21.0"
phf = { version = "0.11", features = ["macros"] }