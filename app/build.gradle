def gitCommitHash
try {
    gitCommitHash = "git rev-parse HEAD".execute(null, projectDir).text.trim()
} catch (Exception e) {
    gitCommitHash = "unknown"
}

def repairedJarDir = layout.buildDirectory.dir("repaired-libs")

tasks.register("repairApksignerJar") {
    def originalJar = file("libs/build-tools_apksigner_32.0.0.jar")
    def outputDir = repairedJarDir.get().asFile

    outputs.dir(outputDir)

    doLast {
        outputDir.mkdirs()
        def extractDir = new File(outputDir, "extracted")
        extractDir.deleteDir()
        extractDir.mkdirs()

        exec {
            commandLine "unzip", "-o", "-q", originalJar.absolutePath, "-d", extractDir.absolutePath
        }

        def repairedJar = new File(outputDir, "build-tools_apksigner_32.0.0.jar")
        repairedJar.delete()

        exec {
            workingDir extractDir
            commandLine "zip", "-X", "-r", "-q", repairedJar.absolutePath, "."
        }
    }
}

