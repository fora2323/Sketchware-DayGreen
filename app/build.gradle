androidComponents {
    onVariants(selector().all()) { variant ->
        def flavorName = variant.productFlavors.isEmpty() ? "noflavor" : variant.productFlavors.collect { it.second }.join("-")
        def buildType = variant.buildType
        variant.outputs.forEach { output ->
            output.outputFileName.set("app-${buildType}-${flavorName}.apk")
        }
    }
}

